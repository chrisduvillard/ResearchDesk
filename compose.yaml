name: dan-nathan
x-common: &common
  build: .
  image: research-desk:2.0.0-dev
  restart: unless-stopped
  user: "${APP_UID:-1000}:${APP_GID:-1000}"
  init: true
  environment:
    DATA_DIR: /data
    TZ: ${APP_TIMEZONE:-UTC}
    XDG_CACHE_HOME: /data/cache
    REQUIRE_MIGRATION: "1"
    APP_SECURE_COOKIES: ${APP_SECURE_COOKIES:-1}
    APP_ORIGIN: ${APP_ORIGIN:-}
  volumes:
    - type: bind
      source: ${HOST_DATA_DIR:-./data}
      target: /data
      bind:
        create_host_path: false
  read_only: true
  tmpfs:
    - /tmp:size=128m
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
services:
  migrate:
    <<: *common
    restart: "no"
    command: ["python", "-m", "tracker.cli", "migrate"]
  web:
    <<: *common
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${APP_PORT:-8765}:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)",
        ]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
  collector:
    <<: *common
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ["python", "-m", "tracker.cli", "contributor-worker"]
    healthcheck:
      test: ["CMD", "python", "-m", "tracker.cli", "contributor-health"]
      interval: 60s
      timeout: 15s
      start_period: 300s
      retries: 3
  dbmf-collector:
    <<: *common
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ["python", "-m", "tracker.cli", "fund-worker"]
    healthcheck:
      test: ["CMD", "python", "-m", "tracker.cli", "fund-health"]
      interval: 60s
      timeout: 15s
      start_period: 300s
      retries: 3
  analytics:
    <<: *common
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ["python", "-m", "tracker.cli", "analytics-worker"]
    healthcheck:
      test: ["CMD", "python", "-m", "tracker.cli", "analytics-health"]
      interval: 60s
      timeout: 15s
      start_period: 300s
      retries: 3
